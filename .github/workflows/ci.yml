name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run compile:contracts
      - run: npm audit --audit-level=low
      - run: node --check apps/web/main.js
      - run: node --check scripts/arena-server.cjs
      - run: node --check scripts/estimate-bsc-deployment.cjs
      - run: node --check scripts/prepare-bsc-deployment.cjs
